            const renderStep9_Save = () => `
                <div class="wizard-step active">
                    <h2>Save into your project</h2>
                    <p>Click save, then pick your downloaded or cloned repository folder. The wizard writes
                        <code>config.json</code> straight into it — no manual editing, no unzipping.</p>

                    <div class="actions">
                        <button id="save-btn" class="action-btn">💾 Save config.json to my folder</button>
                        <button id="download-btn" class="action-btn secondary">⬇ Download config.json</button>
                    </div>
                    <div id="status" class="status" role="status" aria-live="polite"></div>

                    <div id="result" class="result${configSaved ? ' show' : ''}">
                        <p class="note">✅ Your configuration is saved. Run these commands from your project folder:</p>
                        <div class="terminal">
                            <div class="comment"># 1. Install dependencies</div>
                            <div><span class="prompt">$</span> <span class="cmd">npm install</span></div>
                            <div class="comment"># 2. Run the desktop app</div>
                            <div><span class="prompt">$</span> <span class="cmd">npm start</span></div>
                            <div class="comment"># 3. Build an installer</div>
                            <div><span class="prompt">$</span> <span class="cmd">npm run make</span></div>
                        </div>
                        <div class="actions">
                            <button class="action-btn secondary" data-copy="${escapeHtml(renderCommands())}">Copy commands</button>
                        </div>
                    </div>

                    <h3>What gets written</h3>
                    ${renderCodeBlock('json-preview', JSON.stringify(toConfig(configData), null, 2), { copyTarget: 'json-preview', scroll: true })}
                    <p class="description"><code>config.json</code> is git-ignored on purpose: it is specific to each user
                        and machine. Commit <code>config.example.json</code> instead.</p>
                </div>`;

            const renderStep10_NextSteps = () => `
                <div class="wizard-step active">
                    <h2>You're all set 🎉</h2>
                    <p><code>config.json</code> is in your project folder. Start the app with <code>npm start</code>, then
                        distribute it however your team needs it.</p>

                    <h3>Run it</h3>
                    <div class="terminal">
                        <div class="comment"># from your project folder</div>
                        <div><span class="prompt">$</span> <span class="cmd">npm install</span></div>
                        <div><span class="prompt">$</span> <span class="cmd">npm start</span></div>
                    </div>

                    <h3>Package it</h3>
                    <p>Electron Forge builds the installer for the operating system you run it on:</p>
                    <div class="distro-tabs">
                        <button class="distro-tab-btn active" data-tab="win">🪟 Windows</button>
                        <button class="distro-tab-btn" data-tab="mac">🍎 macOS</button>
                        <button class="distro-tab-btn" data-tab="linux">🐧 Linux</button>
                    </div>
                    <div class="distro-tab-content active" data-content="win">
                        <p>Produces a Squirrel installer:</p>
                        <div class="terminal">
                            <div><span class="prompt">$</span> <span class="cmd">npm run make</span></div>
                            <div class="comment"># out/make/squirrel.windows/x64/*.exe</div>
                        </div>
                        <p class="description">Hand the <code>.exe</code> to your users, or push it through Microsoft Intune
                            for internal IT deployment. Sign it first if your organisation requires it.</p>
                    </div>
                    <div class="distro-tab-content" data-content="mac">
                        <p>Produces a ZIP app bundle:</p>
                        <div class="terminal">
                            <div><span class="prompt">$</span> <span class="cmd">npm run make</span></div>
                            <div class="comment"># out/make/zip/darwin/&lt;arch&gt;/Power App Desktop Extension-darwin-&lt;arch&gt;-1.1.0.zip</div>
                        </div>
                        <p class="description">Unzip it and drag the app into Applications. Users may need to right-click →
                            Open the first time if it is unsigned.</p>
                    </div>
                    <div class="distro-tab-content" data-content="linux">
                        <p>Produces a ZIP app bundle:</p>
                        <div class="terminal">
                            <div><span class="prompt">$</span> <span class="cmd">npm run make</span></div>
                            <div class="comment"># out/make/zip/linux/x64/*.zip</div>
                        </div>
                        <p class="description">Unzip and run the executable inside. No system package is required.</p>
                    </div>

                    <h3>Ship the config too</h3>
                    <p class="description">Because <code>config.json</code> is user-specific it is <strong>not</strong> bundled into
                        the app. Send it alongside the installer, or point people at this wizard and let them generate
                        their own.</p>

                    <h3>Test it</h3>
                    <div class="terminal">
                        <div><span class="prompt">$</span> <span class="cmd">npm test</span></div>
                        <div class="comment"># Runs the node:test suite (no Electron binary required)</div>
                    </div>
                    <p class="description">Debugging tips live in the <a href="README.md" target="_blank" rel="noopener">README</a> —
                        <code>Ctrl/Cmd + Shift + I</code> opens DevTools for the focused pane and every update is logged with
                        the <code>[PowerApp Desktop]</code> prefix.</p>
                </div>`;

            // -----------------------------------------------------------------
            // Wizard flow
            // -----------------------------------------------------------------

            // Exposed for the test suite so every step's markup can be rendered and checked without a
            // browser, and so the state can be seeded for the HTML-escaping checks.
            Object.assign(window.PowerAppWizard, {
                setConfig: (partial) => Object.assign(configData, partial),
                steps: {
                    renderIntroStep, renderStep1, renderStep2, renderStep3_DataSource,
                    renderStep4_FindPageData, renderStep5_FindStorageData, renderStep6_Triggers,
                    renderStep7_TestAndPreview, renderStep8_Review, renderStep9_Save, renderStep10_NextSteps
                }
            });

            // Builds the ordered list of steps for the current phase. The optional steps are only
            // inserted when the matching data source is enabled, mirroring the sister project's wizard.
            const buildWizardSteps = () => {
                let steps = [];

                // Writing config.json ends the configuration phase: the wizard swaps its whole step
                // list for the distribution guide, exactly like the sister project does after building.
                // The flag is consumed here so Previous can walk back into the wizard afterwards.
                if (configSaved && !isBuilt) {
                    isBuilt = true;
                    configSaved = false;
                    console.log('[PowerApp Desktop Builder] config.json saved - switching to the distribution guide.');
                }

                if (!isBuilt) {
                    steps = [renderIntroStep, renderStep1, renderStep2, renderStep3_DataSource];
                    if (configData.includeTabBody) steps.push(renderStep4_FindPageData);
                    if (configData.includeLocalStorage) steps.push(renderStep5_FindStorageData);
                    steps.push(renderStep6_Triggers);
                    steps.push(renderStep7_TestAndPreview);
                    steps.push(renderStep8_Review);
                    steps.push(renderStep9_Save);
                } else {
                    steps = [renderStep10_NextSteps];
                }

                wizardSteps = steps;
                console.log(`[PowerApp Desktop Builder] ${wizardSteps.length} step(s) in the current phase.`);
            };

            const isOnIntroStep = () => wizardSteps[currentStep] === renderIntroStep;
            const isOnPreviewStep = () => wizardSteps[currentStep] === renderStep7_TestAndPreview;
            const isOnSaveStep = () => wizardSteps[currentStep] === renderStep9_Save;
            const isOnFinalStep = () => isBuilt && wizardSteps[currentStep] === renderStep10_NextSteps;

            const renderCurrentStep = () => {
                if (currentStep < 0 || currentStep >= wizardSteps.length) currentStep = 0;

                const container = document.querySelector('#wizard-container');

                // The intro and the preview step use the wide layout, mirroring the sister wizard.
                const shell = document.querySelector('.container');
                if (shell) shell.style.maxWidth = (isOnIntroStep() || isOnPreviewStep()) ? '1200px' : 'var(--container-width)';

                container.innerHTML = wizardSteps[currentStep]();
                console.log(`[PowerApp Desktop Builder] Rendering step ${currentStep + 1}/${wizardSteps.length}`);

                bindStep();

                const restartBtn = $('restart-wizard-header-btn');
                const header = document.querySelector('header');
                const nav = document.querySelector('.wizard-navigation');
                const onIntro = isOnIntroStep();

                if (restartBtn && header && nav) {
                    restartBtn.style.display = onIntro ? 'none' : 'block';
                    header.style.minHeight = onIntro ? '0' : '50px';
                    header.style.padding = onIntro ? '0' : '15px 30px';
                    nav.style.display = onIntro ? 'none' : 'flex';
                }

                updateNavButtons();
            };

            const updateNavButtons = () => {
                const prevBtn = $('prev-btn');
                const nextBtn = $('next-btn');

                prevBtn.disabled = currentStep === 0 && !isBuilt;

                if (isOnFinalStep()) {
                    nextBtn.textContent = '🔄 Start Over';
                } else if (isOnSaveStep()) {
                    nextBtn.textContent = configSaved ? 'Continue →' : '💾 Save config.json';
                } else if (isOnIntroStep()) {
                    nextBtn.textContent = 'Get Started →';
                } else {
                    nextBtn.textContent = 'Next';
                }
            };

            /** Pulls the values of the current step back into `configData`. */
            const saveCurrentStepData = () => {
                const saveActions = new Map([
                    [renderStep1, () => {
                        configData.powerAppUrl = valueOf('powerAppUrl');
                        configData.defaultMainUrl = valueOf('defaultMainUrl');
                    }],
                    [renderStep2, () => {
                        configData.windowWidth = Number(valueOf('windowWidth')) || defaultConfig.windowWidth;
                        configData.windowHeight = Number(valueOf('windowHeight')) || defaultConfig.windowHeight;
                        configData.sidebarWidth = Number(valueOf('sidebarWidth')) || defaultConfig.sidebarWidth;
                    }],
                    [renderStep3_DataSource, () => {
                        configData.includeTabUrl = checkedOf('includeTabUrl');
                        configData.includeTabBody = checkedOf('includeTabBody');
                        configData.includeLocalStorage = checkedOf('includeLocalStorage');
                    }],
                    [renderStep4_FindPageData, () => { configData.targetIds = parseList(valueOf('targetIds')); }],
                    [renderStep5_FindStorageData, () => { configData.targetLocalStorageKeys = parseList(valueOf('targetLocalStorageKeys')); }],
                    [renderStep6_Triggers, () => {
                        configData.onUrlChange = checkedOf('onUrlChange');
                        configData.onTimerEnabled = checkedOf('onTimerEnabled');
                        configData.onTimerInterval = Number(valueOf('onTimerInterval')) || defaultConfig.onTimerInterval;
                    }]
                ]);

                const saveAction = saveActions.get(wizardSteps[currentStep]);
                if (saveAction) saveAction();
            };

            // -----------------------------------------------------------------
            // Per-step event wiring
            // -----------------------------------------------------------------

            const bindStep = () => {
                bindCopyButtons();

                const heroCta = $('hero-get-started-btn');
                if (heroCta) heroCta.addEventListener('click', () => goToNextStep());

                const importInput = $('import-config-file');
                if (importInput) importInput.addEventListener('change', importConfigFile);

                const timerToggle = $('onTimerEnabled');
                if (timerToggle) {
                    timerToggle.addEventListener('change', () => {
                        const fields = $('timer-fields');
                        if (fields) fields.style.display = timerToggle.checked ? 'block' : 'none';
                    });
                }

                if (isOnPreviewStep()) bindPreviewStep();

                const saveBtn = $('save-btn');
                if (saveBtn) saveBtn.addEventListener('click', handleSave);

                const downloadBtn = $('download-btn');
                if (downloadBtn) downloadBtn.addEventListener('click', downloadConfig);

                document.querySelectorAll('.distro-tab-btn').forEach((button) => {
                    button.addEventListener('click', () => {
                        document.querySelectorAll('.distro-tab-btn').forEach((other) => other.classList.remove('active'));
                        document.querySelectorAll('.distro-tab-content').forEach((content) => content.classList.remove('active'));
                        button.classList.add('active');
                        const content = document.querySelector(`.distro-tab-content[data-content="${button.dataset.tab}"]`);
                        if (content) content.classList.add('active');
                    });
                });
            };

            const goToNextStep = () => {
                if (isOnFinalStep()) return restartWizard();
                saveCurrentStepData();
                buildWizardSteps();
                currentStep = Math.min(currentStep + 1, wizardSteps.length - 1);
                renderCurrentStep();
                saveState();
            };

            // -----------------------------------------------------------------
            // Simulated output (Test & Preview)
            // -----------------------------------------------------------------

            let lastSimulatedUrl = null;

            const bindPreviewStep = () => {
                const button = $('simulateBtn');
                if (button) button.addEventListener('click', () => runSimulation(true));

                document.querySelectorAll('.sim-input').forEach((input) => {
                    input.addEventListener('input', () => runSimulation(false));
                });

                runSimulation(true);
            };

            const runSimulation = (announce) => {
                const urlBlock = $('simUrl');
                const consoleBlock = $('simConsole');
                if (!urlBlock || !consoleBlock) return;

                const config = toConfig(configData);
                const base = config.powerAppUrl;

                if (!base) {
                    urlBlock.textContent = 'Add your Power App URL in step 1 to simulate the sidebar URL.';
                    $('simScrape').textContent = '{}';
                    consoleBlock.textContent = '[PowerApp Desktop Builder] Waiting for a Power App URL...';
                    $('simParamCount').textContent = '0';
                    $('simUrlLength').textContent = '0';
                    $('simReload').textContent = '—';
                    return;
                }

                const sample = {
                    url: valueOf('simTabUrl') || config.defaultMainUrl,
                    title: 'Sample Page',
                    body: {},
                    localStorage: {}
                };

                (config.parameters.includeTabBody ? config.parameters.targetIds : []).forEach((id) => {
                    sample.body[id] = valueOf('sim_' + id);
                });
                (config.parameters.includeLocalStorage ? config.parameters.targetLocalStorageKeys : []).forEach((key) => {
                    sample.localStorage[key] = valueOf('simloc_' + key);
                });

                const data = buildScrapeResult(config, sample);
                const sidebarUrl = buildSidebarUrl(config, data);

                let search;
                try {
                    search = new URL(sidebarUrl).searchParams;
                } catch (error) {
                    search = new URLSearchParams();
                }

                const parameterNames = [];
                if (config.parameters.includeTabUrl) parameterNames.push('tabURL');
                if (config.parameters.includeTabBody && Object.keys(data.body).length > 0) parameterNames.push('tabBody');
                if (config.parameters.includeLocalStorage && Object.keys(data.localStorage).length > 0) parameterNames.push('tabLocalStorage');

                const reloads = sidebarUrl !== lastSimulatedUrl;
                lastSimulatedUrl = sidebarUrl;

                urlBlock.textContent = sidebarUrl;
                $('simScrape').textContent = JSON.stringify(data, null, 2);
                $('simParamCount').textContent = String(parameterNames.length);
                $('simUrlLength').textContent = String(sidebarUrl.length);
                $('simReload').textContent = reloads ? 'Reload' : 'Skipped';

                const urlNote = $('simUrlNote');
                if (sidebarUrl.length > 2000) {
                    urlNote.innerHTML = '⚠️ This URL is ' + sidebarUrl.length + ' characters long. Very long URLs can be rejected by Power Apps — send fewer element IDs or shorter values.';
                    urlNote.className = 'sim-warning';
                } else {
                    urlNote.textContent = parameterNames.length
                        ? 'Parameters appended: ' + parameterNames.join(', ') + '. Existing parameters on your Power App URL are preserved.'
                        : 'No context parameters are enabled yet, so the sidebar keeps its base URL.';
                    urlNote.className = 'description';
                }

                const mockedMainUrl = $('mockMainUrl');
                if (mockedMainUrl) mockedMainUrl.textContent = sample.url;

                const lines = [
                    ['[PowerApp Desktop]', 'Loaded configuration from config.json'],
                    ['[PowerApp Desktop]', 'Loading Power App: ' + base.split('?')[0]],
                    ['[PowerApp Desktop]', 'Loading main pane: ' + config.defaultMainUrl],
                    ['[PowerApp Desktop]', 'Trigger fired: ' + (config.triggers.onTimer.enabled ? 'polling timer' : 'main pane navigated')],
                    ['[PowerApp Desktop]', 'Scraped ' + Object.keys(data.body).length + ' element value(s) and ' + Object.keys(data.localStorage).length + ' storage key(s).'],
                    reloads
                        ? ['[PowerApp Desktop]', 'Updating Power App with ' + parameterNames.length + ' parameter(s).']
                        : ['[PowerApp Desktop]', 'Sidebar URL unchanged - skipping reload so the Power App keeps its state.', 'log-warn']
                ];

                consoleBlock.innerHTML = lines.map((line) => {
                    const cls = line[2] ? ' class="' + line[2] + '"' : '';
                    return '<span class="log-prefix">' + escapeHtml(line[0]) + '</span><span' + cls + '> ' + escapeHtml(line[1]) + '</span>';
                }).join('\n');

                if (announce) console.log('[PowerApp Desktop Builder] Simulated sidebar URL:', sidebarUrl);
            };

            // -----------------------------------------------------------------
            // Save / download
            // -----------------------------------------------------------------

            const setStatus = (message, kind) => {
                const status = $('status');
                if (!status) return;
                status.textContent = message || '';
                status.className = 'status' + (kind ? ' ' + kind : '');
            };

            const showResult = () => {
                const result = $('result');
                if (result) result.classList.add('show');
            };

            const handleSave = async () => {
                const config = toConfig(configData);

                if (!config.powerAppUrl) {
                    setStatus('Please enter your Power App URL in step 1 first.', 'err');
                    return false;
                }

                if (!window.showDirectoryPicker) {
                    setStatus('This browser cannot write files directly. Use “Download config.json” instead.', 'err');
                    return false;
                }

                try {
                    setStatus('Waiting for folder selection…');
                    const directory = await window.showDirectoryPicker({ mode: 'readwrite' });
                    const fileHandle = await directory.getFileHandle('config.json', { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(JSON.stringify(config, null, 2) + '\n');
                    await writable.close();

                    configSaved = true;
                    setStatus(`Saved config.json to “${directory.name}”.`, 'ok');
                    showResult();
                    updateNavButtons();
                    saveState();
                    console.log(`[PowerApp Desktop Builder] Saved config.json to “${directory.name}”.`);
                    return true;
                } catch (error) {
                    if (error && error.name === 'AbortError') {
                        setStatus('Save cancelled.');
                    } else {
                        console.error('[PowerApp Desktop Builder] Save failed:', error);
                        setStatus('Could not write the file: ' + error.message, 'err');
                    }
                    return false;
                }
            };

            const downloadConfig = () => {
                const config = toConfig(configData);
                if (!config.powerAppUrl) {
                    setStatus('Please enter your Power App URL in step 1 first.', 'err');
                    return;
                }

                const blob = new Blob([JSON.stringify(config, null, 2) + '\n'], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'config.json';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                configSaved = true;
                setStatus('Downloaded config.json — move it into your project folder.', 'ok');
                showResult();
                updateNavButtons();
                saveState();
            };

            // -----------------------------------------------------------------
            // Import / restart / copy
            // -----------------------------------------------------------------

            const importConfigFile = async (event) => {
                const file = event.target.files && event.target.files[0];
                const status = $('import-status');
                if (!file) return;

                try {
                    const parsed = JSON.parse(await file.text());
                    const parameters = parsed.parameters || {};
                    const triggers = parsed.triggers || {};
                    const onTimer = triggers.onTimer || {};

                    Object.assign(configData, {
                        powerAppUrl: parsed.powerAppUrl || configData.powerAppUrl,
                        defaultMainUrl: parsed.defaultMainUrl || configData.defaultMainUrl,
                        sidebarWidth: Number(parsed.sidebarWidth) || configData.sidebarWidth,
                        windowWidth: Number(parsed.windowWidth) || configData.windowWidth,
                        windowHeight: Number(parsed.windowHeight) || configData.windowHeight,
                        includeTabUrl: parameters.includeTabUrl !== false,
                        includeTabBody: !!parameters.includeTabBody,
                        targetIds: Array.isArray(parameters.targetIds) ? parameters.targetIds : parseList(parameters.targetIds),
                        includeLocalStorage: !!parameters.includeLocalStorage,
                        targetLocalStorageKeys: Array.isArray(parameters.targetLocalStorageKeys)
                            ? parameters.targetLocalStorageKeys
                            : parseList(parameters.targetLocalStorageKeys),
                        onUrlChange: triggers.onUrlChange !== false,
                        onTimerEnabled: !!onTimer.enabled,
                        onTimerInterval: Number(onTimer.interval) || configData.onTimerInterval
                    });

                    isBuilt = false;
                    buildWizardSteps();
                    currentStep = 1;
                    renderCurrentStep();
                    saveState();
                    console.log('[PowerApp Desktop Builder] Imported configuration from', file.name);
                } catch (error) {
                    console.error('[PowerApp Desktop Builder] Import failed:', error);
                    if (status) status.textContent = 'Could not read that file — is it a valid config.json?';
                }
            };

            const restartWizard = () => {
                if (!confirm('Start over with a fresh configuration?')) return;
                try {
                    localStorage.removeItem(STATE_KEY);
                } catch (error) {
                    console.warn('[PowerApp Desktop Builder] Could not clear saved state:', error);
                }
                configData = Object.assign({}, defaultConfig);
                currentStep = 0;
                isBuilt = false;
                configSaved = false;
                buildWizardSteps();
                renderCurrentStep();
            };

            const bindCopyButtons = () => {
                const flash = (button, text) => {
                    if (!button.dataset.originalText) button.dataset.originalText = button.textContent;
                    button.textContent = text;
                    button.classList.add('copied');
                    setTimeout(() => {
                        button.textContent = button.dataset.originalText;
                        button.classList.remove('copied');
                    }, 1500);
                };

                document.querySelectorAll('.copy-btn, [data-copy]').forEach((button) => {
                    button.addEventListener('click', async () => {
                        const targetId = button.getAttribute('data-copy-target');
                        const text = targetId
                            ? ($(targetId) ? $(targetId).textContent : '')
                            : (button.getAttribute('data-copy') || '');
                        if (!text) return;

                        try {
                            await navigator.clipboard.writeText(text);
                            flash(button, 'Copied!');
                        } catch (error) {
                            console.warn('[PowerApp Desktop Builder] Clipboard unavailable:', error);
                            flash(button, 'Press Ctrl+C');
                        }
                    });
                });
            };

            // -----------------------------------------------------------------
            // Navigation + init
            // -----------------------------------------------------------------

            const init = () => {
                console.log('[PowerApp Desktop Builder] Initializing wizard v1.1.0...');

                const nextBtn = $('next-btn');
                const prevBtn = $('prev-btn');
                const restartBtn = $('restart-wizard-header-btn');

                loadState();
                buildWizardSteps();
                renderCurrentStep();

                nextBtn.addEventListener('click', async () => {
                    if (isOnFinalStep()) return restartWizard();

                    if (isOnSaveStep() && !configSaved) {
                        const saved = await handleSave();
                        if (!saved) return;
                    }

                    goToNextStep();
                });

                prevBtn.addEventListener('click', () => {
                    if (isBuilt) {
                        isBuilt = false;
                        buildWizardSteps();
                        currentStep = wizardSteps.length - 1;
                        renderCurrentStep();
                        saveState();
                        return;
                    }

                    saveCurrentStepData();
                    buildWizardSteps();
                    currentStep = Math.max(0, currentStep - 1);
                    renderCurrentStep();
                    saveState();
                });

                restartBtn.addEventListener('click', restartWizard);

                console.log('[PowerApp Desktop Builder] Wizard ready.');
            };

            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
</html>
