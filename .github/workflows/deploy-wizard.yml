name: Deploy Wizard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp wizard.html _site/index.html
          # Also keep the file's own name: Research_Tools links back to ../wizard.html.
          cp wizard.html _site/wizard.html
          cp README.md _site/README.md
          cp config.example.json _site/config.example.json
          cp -r Research_Tools _site/Research_Tools

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
